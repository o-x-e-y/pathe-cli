[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathe-cli"
version = "0.1.0"
description = "Read-only CLI for the public Pathé Nederland programme API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.scripts]
pathe = "pathe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pathe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is entirely offline: every test drives a fake client backed by
# recorded fixtures, so it never depends on the network or on today's date.
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# DTZ011: `date.today()` is deliberate. Cinema programmes are published against
# the local calendar day in Europe/Amsterdam; a timezone-aware UTC "today" would
# show tomorrow's programme after 22:00 local in summer.
ignore = ["DTZ011"]

[tool.ruff.lint.per-file-ignores]
# Throwaway stand-in classes in tests do not need ClassVar annotations.
"tests/*" = ["RUF012"]
